[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shop"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v --strict-markers --cov=shop --cov-branch --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["shop"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85.0